<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 800" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">ADG minimum one-bedroom apartment, 50 square metres, furnished to scale</title>
  <desc id="d">Single-aspect one-bedroom apartment, 6.6 by 7.6 metres. Living and dining 3.6 metres wide with a kitchen along one wall. Bedroom 3.0 by 3.4 metres with a 1.53 by 2.03 metre queen bed. Bathroom with laundry. 8 square metre balcony, 2 metres deep.</desc>
  <!-- Scale: 1 m = 60 px. Apartment origin at (60, 70). -->
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#d8cdbd" stroke-width="1.2"/>
    </pattern>
    <style>
      .floor { fill: #fbf8f3; }
      .wall { stroke: #3a3129; stroke-linecap: square; fill: none; }
      .ext { stroke-width: 6; }
      .int { stroke-width: 3; }
      .furn { fill: #ede5d8; stroke: #8a7d6d; stroke-width: 1.2; }
      .fix { fill: #ffffff; stroke: #8a7d6d; stroke-width: 1.2; }
      .swing { fill: none; stroke: #8a7d6d; stroke-width: 0.9; }
      .leaf { stroke: #3a3129; stroke-width: 2; stroke-linecap: square; }
      .win { stroke: #8a7d6d; stroke-width: 1.2; }
      .lbl { font-size: 15px; font-weight: 600; fill: #2b2620; text-anchor: middle; }
      .area { font-size: 12.5px; fill: #4a4036; text-anchor: middle; }
      .small { font-size: 11px; fill: #4a4036; text-anchor: middle; }
      .dim { stroke: #6b6155; stroke-width: 1; }
      .dimtxt { font-size: 12.5px; fill: #2b2620; text-anchor: middle; font-weight: 500; }
      .note { font-size: 12px; fill: #3a3129; }
      .callout-line { stroke: #6e5a45; stroke-width: 1; fill: none; }
    </style>
  </defs>

  <!-- Title -->
  <text x="60" y="30" font-size="15" font-weight="600" fill="#2b2620">ADG minimum one-bedroom · 50 m²</text>
  <text x="60" y="48" font-size="11" fill="#6b6155">Furnished to scale with real furniture sizes</text>

  <!-- Floor -->
  <rect class="floor" x="60" y="70" width="396" height="456"/>

  <!-- Balcony (outside the 50 m²): 4.0 x 2.0 m -->
  <rect x="60" y="526" width="240" height="120" fill="url(#hatch)" stroke="#8a7d6d" stroke-width="1.2" stroke-dasharray="5 4"/>

  <!-- ===== Furniture & fixtures ===== -->
  <!-- Kitchen bench along left wall: x 0–0.6, y 0.8–3.4 -->
  <rect class="furn" x="60" y="118" width="36" height="156"/>
  <rect class="fix" x="60" y="118" width="36" height="42"/>                 <!-- fridge 0.7 -->
  <text class="small" x="78" y="143" transform="rotate(-90 78 140)">Fridge</text>
  <rect class="fix" x="66" y="176" width="24" height="30" rx="3"/>          <!-- sink -->
  <circle class="fix" cx="78" cy="232" r="6"/><circle class="fix" cx="78" cy="252" r="6"/> <!-- cooktop -->

  <!-- Entry storage cupboard: x 2.6–3.6, y 0–0.6 -->
  <rect class="furn" x="216" y="70" width="60" height="36"/>
  <text class="small" x="246" y="92">Storage</text>

  <!-- Dining table 1.0 x 0.8 with 4 chairs: x 1.3–2.3, y 3.7–4.5 -->
  <rect class="furn" x="138" y="292" width="60" height="48" rx="3"/>
  <rect class="furn" x="146" y="282" width="18" height="9" rx="2"/><rect class="furn" x="172" y="282" width="18" height="9" rx="2"/>
  <rect class="furn" x="146" y="341" width="18" height="9" rx="2"/><rect class="furn" x="172" y="341" width="18" height="9" rx="2"/>

  <!-- Sofa 2.0 x 0.9 against partition: x 2.7–3.6, y 5.3–7.3 -->
  <rect class="furn" x="222" y="388" width="54" height="120" rx="6"/>
  <rect class="furn" x="262" y="388" width="14" height="120" rx="4"/>
  <!-- Coffee table 0.5 x 0.9: x 1.75–2.25, y 5.85–6.75 -->
  <rect class="furn" x="165" y="421" width="30" height="54" rx="3"/>
  <!-- TV unit 0.4 x 1.4 on left wall: y 5.6–7.0 -->
  <rect class="furn" x="60" y="406" width="24" height="84"/>
  <text class="small" x="72" y="451" transform="rotate(-90 72 448)">TV</text>

  <!-- Bathroom fixtures: x 3.6–6.6, y 0–2.4 -->
  <rect class="fix" x="276" y="70" width="60" height="30"/>                 <!-- vanity 1.0 x 0.5 -->
  <ellipse class="fix" cx="306" cy="85" rx="14" ry="9"/>
  <rect class="fix" x="342" y="70" width="42" height="36"/>                 <!-- washer/dryer -->
  <text class="small" x="363" y="92" style="font-size:9.5px">Laundry</text>
  <rect class="fix" x="402" y="70" width="54" height="54"/>                 <!-- shower 0.9 x 0.9 -->
  <line class="win" x1="402" y1="70" x2="456" y2="124"/><line class="win" x1="456" y1="70" x2="402" y2="124"/>
  <rect class="fix" x="428" y="148" width="24" height="18" rx="2"/>         <!-- WC cistern -->
  <ellipse class="fix" cx="440" cy="180" rx="11" ry="15"/>                  <!-- WC pan -->

  <!-- Linen cupboard at end of hall: x 6.0–6.6, y 2.4–3.6 -->
  <rect class="furn" x="420" y="214" width="36" height="72"/>
  <text class="small" x="438" y="253" transform="rotate(-90 438 250)">Linen</text>

  <!-- Bedroom: x 3.6–6.6, y 3.6–7.6 -->
  <!-- Wardrobe 2.0 x 0.6 against back wall: x 4.6–6.6, y 3.6–4.2 -->
  <rect class="furn" x="336" y="286" width="120" height="36"/>
  <text class="small" x="396" y="307">Wardrobe 2.0 m</text>
  <!-- Wardrobe hinged doors (0.5 m leaves) swing into the room -->
  <line class="leaf" x1="366" y1="322" x2="366" y2="352"/><path class="swing" d="M366 352 A30 30 0 0 0 396 322"/>
  <line class="leaf" x1="426" y1="322" x2="426" y2="352"/><path class="swing" d="M426 352 A30 30 0 0 1 396 322"/>
  <!-- Queen bed 1.53 x 2.03, head on right wall: x 4.57–6.6, y 5.2–6.73 -->
  <rect class="furn" x="334.2" y="382" width="121.8" height="91.8" rx="3"/>
  <rect class="fix" x="430" y="390" width="20" height="34" rx="4"/><rect class="fix" x="430" y="432" width="20" height="34" rx="4"/>
  <text class="small" x="384" y="424">Queen bed</text>
  <text class="small" x="384" y="437">1.53 × 2.03 m</text>
  <!-- Bedside table 0.45 x 0.4 -->
  <rect class="furn" x="429" y="477" width="27" height="24"/>

  <!-- ===== Walls ===== -->
  <!-- External walls, with openings for windows on the bottom (window) wall and the entry door on the top wall -->
  <path class="wall ext" d="M132 70 H60 V526 H84"/>                    <!-- top-left to window wall -->
  <path class="wall ext" d="M186 70 H456 V526 H432"/>                  <!-- entry gap x 1.2–2.1 -->
  <path class="wall ext" d="M252 526 H300"/>                            <!-- pier between living and bedroom windows -->
  <!-- Living sliding door (x 0.4–3.2) and bedroom window (x 4.0–6.2) -->
  <line class="win" x1="84" y1="523" x2="252" y2="523"/><line class="win" x1="84" y1="529" x2="252" y2="529"/>
  <line class="win" x1="300" y1="523" x2="432" y2="523"/><line class="win" x1="300" y1="529" x2="432" y2="529"/>

  <!-- Internal walls -->
  <path class="wall int" d="M276 70 V214"/>                             <!-- bathroom west wall -->
  <path class="wall int" d="M276 214 H336 M384 214 H456"/>              <!-- bathroom south wall, door gap x 4.6–5.4 -->
  <path class="wall int" d="M276 286 V526"/>                            <!-- living / bedroom partition -->
  <path class="wall int" d="M330 286 H456"/>                            <!-- bedroom north wall, door gap x 3.6–4.5 -->

  <!-- Doors -->
  <line class="leaf" x1="133" y1="73" x2="133" y2="124"/><path class="swing" d="M133 124 A53 53 0 0 0 186 71"/>   <!-- entry 0.9 -->
  <line class="leaf" x1="337" y1="212" x2="337" y2="166"/><path class="swing" d="M337 166 A47 47 0 0 1 384 213"/> <!-- bathroom 0.8 -->
  <line class="leaf" x1="279" y1="288" x2="279" y2="337"/><path class="swing" d="M279 337 A51 51 0 0 0 330 287"/> <!-- bedroom 0.85 -->

  <!-- ===== Room labels ===== -->
  <text class="lbl" x="168" y="232">Kitchen</text>
  <text class="lbl" x="150" y="380">Living / dining</text>
  <text class="area" x="150" y="395">3.6 × 4.0 m · 14.4 m²</text>
  <text class="lbl" x="356" y="497">Bedroom</text>
  <text class="area" x="356" y="511">3.0 × 3.4 m · 10.2 m²</text>
  <text class="lbl" x="366" y="140">Bath / laundry</text>
  <text class="lbl" x="159" y="62" font-size="10" font-weight="500" fill="#6b6155">Entry</text>
  <text class="lbl" x="180" y="582">Balcony</text>
  <text class="area" x="180" y="597">4.0 × 2.0 m · 8 m²</text>

  <!-- ===== Gap between open wardrobe doors and bed ===== -->
  <line class="callout-line" x1="366" y1="352" x2="366" y2="382"/>
  <line class="callout-line" x1="361" y1="352" x2="371" y2="352"/><line class="callout-line" x1="361" y1="382" x2="371" y2="382"/>
  <text class="small" x="374" y="372" style="text-anchor:start; fill:#6e5a45; font-weight:600">0.5 m</text>

  <!-- ===== Dimensions ===== -->
  <!-- Overall width 6.6 m (top) -->
  <line class="dim" x1="60" y1="660" x2="456" y2="660"/>
  <line class="dim" x1="60" y1="654" x2="60" y2="666"/><line class="dim" x1="276" y1="654" x2="276" y2="666"/><line class="dim" x1="456" y1="654" x2="456" y2="666"/>
  <text class="dimtxt" x="168" y="676">3.6 m living (ADG min. width)</text>
  <text class="dimtxt" x="366" y="676">3.0 m bedroom (ADG min.)</text>
  <!-- Overall depth 7.6 m (right) -->
  <line class="dim" x1="490" y1="70" x2="490" y2="526"/>
  <line class="dim" x1="484" y1="70" x2="496" y2="70"/><line class="dim" x1="484" y1="526" x2="496" y2="526"/>
  <text class="dimtxt" x="505" y="300" transform="rotate(90 505 300)">7.6 m deep (max. 8 m from a window)</text>

  <!-- ===== Scale bar ===== -->
  <g transform="translate(60 706)">
    <rect x="0" y="0" width="60" height="6" fill="#3a3129"/>
    <rect x="60" y="0" width="60" height="6" fill="#fff" stroke="#3a3129"/>
    <rect x="120" y="0" width="60" height="6" fill="#3a3129"/>
    <text class="small" x="0" y="20">0</text><text class="small" x="60" y="20">1</text><text class="small" x="120" y="20">2</text><text class="small" x="180" y="20">3 m</text>
  </g>

  <!-- ===== Notes ===== -->
  <text class="note" x="262" y="712">Internal area 50 m² (6.6 × 7.6 m), excl. balcony</text>
  <text class="note" x="262" y="729">Ceiling height 2.7 m · single aspect</text>
  <text class="note" x="262" y="746">Every room is at the ADG minimum</text>
  <text font-size="9" fill="#6b6155" x="60" y="780">Drawing: Sophie Evennett &amp; Christian Migliorino, UTS 2026. Benchmarks: NSW Apartment Design Guide (2015).</text>
</svg>
